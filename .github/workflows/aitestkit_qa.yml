name: AITestKit Automated AI QA Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ai-qa-evaluation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install AITestKit & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install typer rich pytest
          pip install -e .

      - name: Execute Automated Zero-Code AI QA Scan
        run: |
          aitest run