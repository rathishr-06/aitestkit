[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aitestkit"
version = "0.1.0"
description = "A unified, plugin-first AI Evaluation Platform for LLMs, RAG, and Performance Benchmarking."
readme = "README.md"
authors = [{ name = "Rathish", email = "rathish@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "psutil>=5.9.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
aitest = "aitestkit.cli.main:cli"